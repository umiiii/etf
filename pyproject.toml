[project]
name = "etfprem"
version = "0.1.0"
description = "QDII ETF 溢价率计算器：用申赎清单成分股独立估算基金净值"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
etfprem = "etfprem.cli:main"

[project.optional-dependencies]
analysis = [
    "numpy>=2.4.6",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etfprem"]
